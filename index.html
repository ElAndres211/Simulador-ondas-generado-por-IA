<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Ondas en Cuerdas (Melde)</title>
    <style>
        :root {
            --bg: #1e1e1e; --panel: #2d2d2d; --text: #eee; --accent: #4caf50; --border: #444;
        }
        body {
            font-family: Arial, sans-serif; background-color: var(--bg); color: var(--text);
            margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh;
        }
        .container { display: flex; flex: 1; gap: 10px; overflow: hidden; }
        .controls {
            width: 350px; background: var(--panel); padding: 15px; border-radius: 8px;
            overflow-y: auto; border: 1px solid var(--border);
        }
        .canvas-container {
            flex: 1; display: flex; flex-direction: column; gap: 10px;
        }
        canvas {
            background: #111; border-radius: 8px; border: 1px solid var(--border);
            width: 100%; flex: 1; cursor: crosshair;
        }
        h2, h3 { margin-top: 0; color: var(--accent); }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 4px; }
        input[type="range"] { width: 100%; }
        input[type="number"] { width: 70px; background: #222; color: #fff; border: 1px solid var(--border); padding: 3px; }
        .row { display: flex; gap: 5px; align-items: center; }
        button {
            background: var(--accent); color: white; border: none; padding: 6px 10px;
            border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        button:hover { background: #45a049; }
        .data-table {
            background: var(--panel); padding: 10px; border-radius: 8px;
            max-height: 150px; overflow-y: auto; font-size: 12px;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid var(--border); padding: 4px; text-align: center; }
        th { background: #333; }
        .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab { padding: 8px 12px; background: #333; cursor: pointer; border-radius: 4px; }
        .tab.active { background: var(--accent); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="tabs">
    <div class="tab active" onclick="setMode(1)">Modo 1: Onda Estacionaria</div>
    <div class="tab" onclick="setMode(2)">Modo 2: Onda Viajera</div>
</div>

<div class="container">
    <div class="controls">
        <h2>Parámetros</h2>
        <div class="control-group">
            <label>Tensión (T) [N] - Masa (kg)</label>
            <div class="row">
                <input type="range" id="massSlider" min="0.01" max="12" step="0.01" value="1.02">
                <input type="number" id="massNum" value="1.02" step="0.01"> kg
            </div>
            <div style="font-size:12px; color:#aaa; margin-top:2px;">T = <span id="valT">10.0</span> N</div>
        </div>
        
        <div class="control-group">
            <label>Densidad lineal (μ) [10⁻³ kg/m]</label>
            <div class="row">
                <input type="range" id="muSlider" min="0.1" max="5.0" step="0.01" value="1.0">
                <input type="number" id="muNum" value="1.0" step="0.01">
            </div>
        </div>

        <div class="control-group">
            <label>Frecuencia (f) [Hz]</label>
            <div class="row">
                <input type="range" id="fSlider" min="1" max="100" step="0.01" value="12.5">
                <input type="number" id="fNum" value="12.5" step="0.01">
            </div>
        </div>

        <div class="control-group">
            <label>Longitud (L) [m]</label>
            <div class="row">
                <input type="range" id="LSlider" min="0.5" max="4.0" step="0.01" value="4.0">
                <input type="number" id="LNum" value="4.0" step="0.01">
            </div>
        </div>

        <div class="control-group">
            <label>Amplitud Vibrador (Ad) [mm]</label>
            <div class="row">
                <input type="range" id="ASlider" min="0.5" max="10" step="0.1" value="2.0">
                <input type="number" id="ANum" value="2.0" step="0.1">
            </div>
        </div>

        <div class="control-group">
            <label>Amortiguamiento (γ) [s⁻¹]</label>
            <div class="row">
                <input type="range" id="gammaSlider" min="0" max="5" step="0.01" value="0.5">
                <input type="number" id="gammaNum" value="0.5" step="0.01">
            </div>
        </div>

        <hr style="border-color: var(--border);">
        <div class="control-group">
            <button onclick="toggleTime()">Pausa / Continuar</button>
            <button onclick="recordData()">Registrar Ensayo</button>
        </div>
        <div id="theoryPanel" style="font-size: 12px; color: #aaa;">
            <b>Teoría:</b><br>
            v_teor = <span id="tv">0</span> m/s<br>
            λ_teor (n=1) = <span id="tlambda">0</span> m<br>
            f1_teor = <span id="tf1">0</span> Hz
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="simCanvas"></canvas>
        <div class="data-table">
            <table id="dataTable">
                <tr>
                    <th>Masa(kg)</th><th>T(N)</th><th>μ(g/m)</th><th>f(Hz)</th><th>L(m)</th><th>v_teor(m/s)</th><th>n (vientres)</th>
                </tr>
            </table>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    // Variables de estado
    let params = {
        m: 1.02, T: 10.0, mu: 1.0e-3, f: 12.5, L: 4.0, Ad: 2.0e-3, gamma: 0.5,
        mode: 1, time: 0, paused: false
    };

    function updateParams() {
        params.m = parseFloat(document.getElementById('massNum').value);
        params.T = params.m * 9.81;
        document.getElementById('valT').innerText = params.T.toFixed(2);
        
        params.mu = parseFloat(document.getElementById('muNum').value) * 1e-3;
        params.f = parseFloat(document.getElementById('fNum').value);
        params.L = parseFloat(document.getElementById('LNum').value);
        params.Ad = parseFloat(document.getElementById('ANum').value) * 1e-3;
        params.gamma = parseFloat(document.getElementById('gammaNum').value);
        
        let v = Math.sqrt(params.T / params.mu);
        document.getElementById('tv').innerText = v.toFixed(2);
        document.getElementById('tlambda').innerText = (2 * params.L).toFixed(2);
        document.getElementById('tf1').innerText = (v / (2 * params.L)).toFixed(2);
    }

    // Sincronizar sliders y numéricos
    ['mass', 'mu', 'f', 'L', 'A', 'gamma'].forEach(id => {
        const slider = document.getElementById(id + 'Slider');
        const num = document.getElementById(id + 'Num');
        slider.addEventListener('input', () => { num.value = slider.value; updateParams(); });
        num.addEventListener('input', () => { slider.value = num.value; updateParams(); });
    });

    function setMode(m) {
        params.mode = m;
        document.querySelectorAll('.tab').forEach((el, i) => {
            el.className = 'tab' + (i + 1 === m ? ' active' : '');
        });
        params.time = 0;
    }

    function toggleTime() { params.paused = !params.paused; }

    function recordData() {
        const table = document.getElementById('dataTable');
        const v = Math.sqrt(params.T / params.mu);
        // Cálculo aproximado de n
        const n = Math.round((2 * params.L * params.f) / v); 
        
        table.innerHTML += `<tr>
            <td>${params.m.toFixed(3)}</td><td>${params.T.toFixed(2)}</td>
            <td>${(params.mu*1000).toFixed(2)}</td><td>${params.f.toFixed(2)}</td>
            <td>${params.L.toFixed(2)}</td><td>${v.toFixed(2)}</td><td>~${n}</td>
        </tr>`;
    }

    function resize() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resize);

    // Operaciones complejas básicas para la ecuación de onda amortiguada
    function complexSqrt(re, im) {
        const r = Math.sqrt(re*re + im*im);
        return {
            re: Math.sqrt((r + re)/2),
            im: Math.sign(im) * Math.sqrt((r - re)/2)
        };
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const w = canvas.width;
        const h = canvas.height;
        const scaleX = w / (params.L * 1.1); // Dejar margen
        const scaleY = h * 10; // Zoom vertical exagerado para ver la onda

        const v = Math.sqrt(params.T / params.mu);
        const omega = 2 * Math.PI * params.f;
        
        // Número de onda complejo k = (omega/v) * sqrt(1 - i(gamma/omega))
        const innerRe = 1;
        const innerIm = -params.gamma / omega;
        const root = complexSqrt(innerRe, innerIm);
        const kr = (omega / v) * root.re;
        const ki = (omega / v) * root.im;

        ctx.beginPath();
        ctx.strokeStyle = "#4caf50";
        ctx.lineWidth = 3;

        // Dibujar cuerda
        for (let px = 0; px <= w; px += 2) {
            const x = px / scaleX;
            if (x > params.L) break;

            let y = 0;
            if (params.mode === 1) {
                // Aproximación estacionaria simplificada para visualización rápida
                // En un caso real usaríamos la parte real de la solución analítica completa
                // y(x,t) ~ Ad * (sin(k(L-x)) / sin(kL)) * cos(wt)
                // Aquí usamos una envolvente amortiguada para mantener 60fps de forma limpia
                const dampingFactor = Math.exp(-ki * x);
                const kx = kr * x;
                const KL = kr * params.L;
                
                // Resonancia
                const denominator = Math.sqrt(Math.pow(Math.sin(KL), 2) + Math.pow(Math.sinh(ki*params.L), 2));
                const amplitude = (params.Ad / (denominator + 0.001)) * dampingFactor;
                
                y = amplitude * Math.sin(kr * (params.L - x)) * Math.cos(omega * params.time);
            } else {
                // Onda viajera: y(x,t) = Ad * e^(-alpha*x) * sin(kx - wt)
                const alpha = params.gamma / (2 * v);
                y = params.Ad * Math.exp(-alpha * x) * Math.sin(kr * x - omega * params.time);
            }

            const py = h/2 - y * scaleY;
            if (px === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Dibujar soportes
        ctx.fillStyle = "#aaa";
        ctx.fillRect(0, h/2 - 10, 10, 20); // Vibrador
        ctx.beginPath(); ctx.arc(params.L * scaleX, h/2, 10, 0, Math.PI*2); ctx.fill(); // Polea

        if (!params.paused) params.time += 1/60;
        requestAnimationFrame(draw);
    }

    updateParams();
    resize();
    draw();
</script>
</body>
</html>
